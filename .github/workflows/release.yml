name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/build-app.sh
      - name: Zip
        run: cd build && ditto -c -k --keepParent RamRadar.app "RamRadar-${GITHUB_REF_NAME#v}.zip"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/RamRadar-*.zip --generate-notes
